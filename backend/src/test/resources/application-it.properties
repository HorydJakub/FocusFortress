# ---------------------------------------------------------------------------
# Profile "it" - integration tests against a real MySQL 8.4 (Testcontainers)
#
# Self-sufficient on purpose: application.properties is gitignored, so this file
# carries every property the application needs to boot in CI.
# Datasource URL/credentials and the SMTP port are injected at runtime by
# MySqlIntegrationTestBase (@DynamicPropertySource) - nothing here talks to a
# real external service.
# ---------------------------------------------------------------------------

# --- Database (URL / user / password come from the Testcontainers MySQL) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Same strategy as production: Hibernate builds the schema, triggers are added on top.
# "update" (not create-drop) so the schema and the installed triggers survive
# across test classes that share the singleton container.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- JWT (dummy, >= 64 chars, test-only) ---
jwt.secret=integration-test-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
jwt.expiration=86400000

# --- YouTube (bean is replaced by @MockitoBean; values only satisfy @Value) ---
youtube.api.key=dummy-youtube-api-key
youtube.api.base-url=http://localhost:1/youtube-disabled-in-tests

# --- Google OAuth2 (dummy - only needed so the ClientRegistrationRepository boots) ---
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# --- Mail -> GreenMail (port injected dynamically) ---
spring.mail.host=127.0.0.1
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
