# ---------------------------------------------------------------------------
# "test" profile - self-sufficient configuration for API tests.
# application.properties is gitignored, so nothing here may rely on it.
# ---------------------------------------------------------------------------

# In-memory H2 in MySQL compatibility mode (fast, no Docker required)
spring.datasource.url=jdbc:h2:mem:focusfortress;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - dummy secret (HS256 requires >= 32 bytes)
jwt.secret=test-only-jwt-secret-for-focusfortress-api-tests-0123456789abcdefghij
jwt.expiration=86400000

# YouTube - the client bean is replaced by a Mockito mock in tests, values only satisfy @Value
youtube.api.key=dummy-youtube-api-key
youtube.api.base-url=http://localhost:1/youtube/v3

# Google OAuth2 - dummy registration so OAuth2 client auto-configuration can start
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# Mail - GreenMail SMTP; the port is injected dynamically by ApiTestBase
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.root=WARN
logging.level.org.springframework.boot.test=WARN
